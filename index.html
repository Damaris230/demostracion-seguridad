<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR TRAP - Simulación Educativa</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at center, #241010 0%, #080808 60%);

    color: white;
}

/* CONTENEDOR PRINCIPAL */

.contenedor {

    width: 100%;
    max-width: 500px;

    background: rgba(15, 15, 15, 0.96);

    border: 1px solid #444;

    border-radius: 20px;

    padding: 30px 25px;

    text-align: center;

    box-shadow:
        0 0 40px rgba(255, 0, 0, 0.25);

}

/* ICONO */

.icono {

    font-size: 65px;

    margin-bottom: 10px;

    animation: parpadeo 1s infinite;
}

@keyframes parpadeo {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.45;
    }
}

/* TITULO */

h1 {

    margin: 5px 0;

    font-size: 38px;

    letter-spacing: 4px;
}

.subtitulo {

    color: #aaa;

    margin-bottom: 30px;
}

/* MENSAJE */

#mensaje {

    font-size: 18px;

    min-height: 25px;
}

/* BARRA */

.barra {

    width: 100%;

    height: 20px;

    background: #292929;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 25px;
}

#progreso {

    width: 0%;

    height: 100%;

    background: linear-gradient(
        90deg,
        #8b0000,
        #ff0000
    );

    transition: width 0.15s linear;
}

/* PORCENTAJE */

#porcentaje {

    font-size: 22px;

    font-weight: bold;

    margin-top: 12px;
}

/* RESULTADO */

#resultado {

    margin-top: 25px;
}

/* ALERTA */

.alerta {

    border: 1px solid #ff3333;

    background: rgba(100, 0, 0, 0.25);

    border-radius: 15px;

    padding: 20px;

    animation: aparecer 0.5s ease;
}

.alerta h2 {

    color: #ff3333;

    margin-top: 0;
}

/* BOTON */

button {

    border: none;

    border-radius: 10px;

    padding: 14px 25px;

    font-size: 16px;

    font-weight: bold;

    color: white;

    background: #b00000;

    cursor: pointer;

    margin-top: 15px;

    transition: 0.2s;
}

button:hover {

    background: #e00000;

    transform: scale(1.05);
}

/* SIMULACION */

.educacion {

    background: rgba(0, 90, 50, 0.25);

    border: 1px solid #00c878;

    border-radius: 15px;

    padding: 22px;

    animation: aparecer 0.7s ease;
}

.educacion h2 {

    color: #00e58a;

    font-size: 27px;
}

.educacion p {

    line-height: 1.6;

    color: #ddd;
}

/* ANIMACION */

@keyframes aparecer {

    from {

        opacity: 0;

        transform: translateY(15px);
    }

    to {

        opacity: 1;

        transform: translateY(0);
    }
}

/* PIE */

.pie {

    margin-top: 25px;

    font-size: 12px;

    color: #777;
}

</style>
</head>


<body>


<div class="contenedor">

    <div class="icono">
        ⚠️
    </div>


    <h1>
        QR TRAP
    </h1>


    <div class="subtitulo">
        Simulación educativa de ciberseguridad
    </div>


    <p id="mensaje">
        Preparando análisis de seguridad...
    </p>


    <div class="barra">

        <div id="progreso"></div>

    </div>


    <div id="porcentaje">
        0%
    </div>


    <div id="resultado"></div>


    <div class="pie">
        Demostración educativa — ningún dispositivo será modificado
    </div>

</div>



<script>

let progreso = 0;

const barra =
    document.getElementById("progreso");

const porcentaje =
    document.getElementById("porcentaje");

const mensaje =
    document.getElementById("mensaje");

const resultado =
    document.getElementById("resultado");


/* MENSAJES DE LA SIMULACIÓN */

const mensajes = [

    "Inicializando análisis...",

    "Analizando dispositivo...",

    "Comprobando aplicaciones...",

    "Analizando archivos...",

    "Verificando conexiones...",

    "Buscando comportamientos sospechosos...",

    "Comprobando seguridad del sistema...",

    "Finalizando análisis..."

];


let indice = 0;


/* SIMULACION DEL ANALISIS */

const intervalo = setInterval(function() {

    progreso++;

    barra.style.width =
        progreso + "%";

    porcentaje.textContent =
        progreso + "%";


    /*
       Cambiar mensaje durante
       el supuesto análisis
    */

    if (
        progreso % 12 === 0 &&
        indice < mensajes.length
    ) {

        mensaje.textContent =
            mensajes[indice];

        indice++;
    }


    /*
       Cuando termina
    */

    if (progreso >= 100) {

        clearInterval(intervalo);

        mostrarAlerta();
    }


}, 70);



/* MOSTRAR ALERTA */

function mostrarAlerta() {

    mensaje.textContent =
        "⚠️ Análisis finalizado";


    resultado.innerHTML = `

        <div class="alerta">

            <h2>
                🚨 AMENAZA DETECTADA
            </h2>

            <p>
                Se detectaron
                <strong>3 problemas de seguridad.</strong>
            </p>

            <p>
                Se recomienda revisar
                inmediatamente el dispositivo.
            </p>

            <button onclick="mostrarSimulacion()">

                VER RESULTADO

            </button>

        </div>

    `;

}



/* REVELAR LA VERDAD */

function mostrarSimulacion() {

    resultado.innerHTML = `

        <div class="educacion">

            <h2>
                🛡️ ¡SIMULACIÓN!
            </h2>

            <p>

                <strong>
                Tu teléfono NO fue hackeado.
                </strong>

            </p>

            <p>

                Esta página es una demostración
                educativa sobre los riesgos de
                escanear códigos QR desconocidos.

            </p>

            <p>

                Una página web puede mostrar
                mensajes y alertas falsas para
                intentar asustar al usuario.

            </p>

            <p>

                El verdadero peligro aparece cuando
                una persona confía en el enlace,
                descarga archivos o introduce
                información personal.

            </p>

            <br>

            <strong>

                🔐 Nunca introduzcas contraseñas
                en sitios que no hayas verificado.

            </strong>

        </div>

    `;

}

</script>


</body>
</html>
